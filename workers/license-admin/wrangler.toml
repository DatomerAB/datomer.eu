name = "datomer-license-admin"
main = "src/index.js"
compatibility_date = "2026-11-13"
workers_dev = false
preview_urls = false

[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "LICENSE_DB"
database_name = "datomer-license-registry-local-v2"
database_id = "00000000-0000-0000-0000-000000000004"
migrations_dir = "migrations"

[access.dev]
aud = "local-license-admin"

[access.dev.identity]
email = "security-admin@datomer.eu"
name = "Local Security Admin"

[env.preview]
name = "datomer-license-admin-preview"
workers_dev = false
preview_urls = false

[env.preview.vars]
ACCESS_TEAM_DOMAIN = "https://datomer-eu-pages.cloudflareaccess.com"
ACCESS_POLICY_AUD = "ebfa2ab32df5ad5a65455ca536fb74fb8b640c671ce4d735f4ac04ecfcd7f0db"

[[env.preview.routes]]
pattern = "admin-preview.products.datomer.eu"
custom_domain = true

[[env.preview.d1_databases]]
binding = "LICENSE_DB"
database_name = "datomer-license-registry-preview"
database_id = "f61be036-c1e2-4ce8-b460-3fe99c396f6e"
migrations_dir = "migrations"

[env.production]
name = "datomer-license-admin"
workers_dev = false
preview_urls = false

[env.production.vars]
ACCESS_TEAM_DOMAIN = "https://datomer-eu-pages.cloudflareaccess.com"
ACCESS_POLICY_AUD = "703d9c61667301c152a3b12db4d27fc262cbc994e41ab3ace1fc66d7d6716d1e"

[[env.production.routes]]
pattern = "admin.products.datomer.eu"
custom_domain = true

[[env.production.d1_databases]]
binding = "LICENSE_DB"
database_name = "datomer-license-registry-production"
database_id = "52cb40e9-b798-462e-ac3d-65e1aed7d630"
migrations_dir = "migrations"

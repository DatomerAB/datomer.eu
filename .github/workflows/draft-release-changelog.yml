name: Draft release changelog post

# This workflow is triggered by a repository_dispatch event from the private
# DatomerAB/Par repo after a release has been published.  It opens a draft PR
# on DatomerAB/datomer.eu with:
#   - a new changelog post
#   - an updated fallback download URL in src/App.jsx
# for human review before merging.
#
# Required repo secret:
#   CROSS_REPO_DISPATCH_TOKEN - PAT that can push branches and create pull
#                               requests in this repo. The same token used by
#                               DatomerAB/Par to dispatch the event works here.

on:
  repository_dispatch:
    types: [release-published]

jobs:
  draft-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate changelog post and update fallback URL
        id: generate
        env:
          TAG: ${{ github.event.client_payload.tag }}
          DMG_URL: ${{ github.event.client_payload.dmg_url }}
          RELEASE_TITLE: ${{ github.event.client_payload.release_title }}
          RELEASE_BODY: ${{ github.event.client_payload.release_body }}
        run: |
          VERSION="${TAG#v}"
          SLUG_VERSION="${VERSION//./-}"
          DATE="$(date -u +%Y-%m-%d)"
          FILE="src/content/changelog/${DATE}-par-${SLUG_VERSION}.md"

          # Use the provided DMG URL, or build the canonical one from the tag.
          if [[ -n "${DMG_URL}" ]]; then
            FINAL_DMG_URL="${DMG_URL}"
          else
            FINAL_DMG_URL="https://github.com/DatomerAB/par-releases/releases/download/${TAG}/Par_${VERSION}_aarch64.dmg"
          fi

          mkdir -p "$(dirname "$FILE")"

          {
            echo "# Pär ${VERSION}"
            echo ""
            if [[ -n "${RELEASE_TITLE}" && "${RELEASE_TITLE}" != "Pär ${TAG}" ]]; then
              echo "${RELEASE_TITLE}."
              echo ""
            fi
            echo "## What's new"
            echo ""
            if [[ -n "${RELEASE_BODY}" && "${RELEASE_BODY}" != "Release ${TAG}" ]]; then
              echo "${RELEASE_BODY}"
            else
              echo "A new Pär release is available. Download the latest macOS build from the landing page."
            fi
            echo ""
            echo "## Download"
            echo ""
            echo "Get the latest DMG at [par-public](https://datomerab.github.io/par-public/)."
          } > "$FILE"

          echo "Created ${FILE}:"
          cat "$FILE"

          # Update fallback URL in App.jsx so the site still works if latest.json fails.
          sed -i "s|const FALLBACK_DOWNLOAD_URL =.*|const FALLBACK_DOWNLOAD_URL =\n  '${FINAL_DMG_URL}'|" src/App.jsx

          echo "Updated src/App.jsx fallback URL to:"
          grep -A1 "const FALLBACK_DOWNLOAD_URL" src/App.jsx

          echo "file=${FILE}" >> "$GITHUB_OUTPUT"

      - name: Create draft PR
        env:
          TAG: ${{ github.event.client_payload.tag }}
          SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
          # GITHUB_TOKEN cannot create PRs in this repo, so use the PAT that
          # dispatched the event. It already has write access here.
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        run: |
          BRANCH="release-notes/${TAG}"
          FILE="${{ steps.generate.outputs.file }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add "$FILE" src/App.jsx
          git commit -m "chore: draft changelog and fallback URL for ${TAG}"
          # Force-push so re-dispatches overwrite the previous draft branch.
          git push --force origin "$BRANCH"

          gh pr create \
            --title "Release notes: Pär ${TAG}" \
            --body "Draft changelog post and updated fallback download URL for **${TAG}**.\n\nSource release: ${SOURCE_REPO}/releases/tag/${TAG}.\n\n### Review checklist\n- [ ] Changelog post is business-focused and accurate\n- [ ] Fallback download URL in \`src/App.jsx\` points to the correct DMG\n- [ ] No broken links or formatting issues\n\nMerge when ready to deploy." \
            --base main \
            --draft

          echo "Opened draft PR for ${TAG}"

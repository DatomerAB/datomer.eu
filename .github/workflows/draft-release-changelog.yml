name: Draft release changelog PR

on:
  repository_dispatch:
    types:
      - release-published
  workflow_dispatch:
    inputs:
      runner_preference:
        description: "Runner preference"
        type: choice
        default: self-hosted-preferred
        options: [self-hosted-preferred, github-hosted]
      wait_minutes:
        description: "Maximum availability wait (0-30 minutes)"
        type: number
        default: 30
      tag:
        description: "Release tag (e.g. v0.1.0-beta.2026083101)"
        required: true
        type: string
      dmg_url:
        description: "Direct download URL for the macOS DMG"
        required: true
        type: string
      release_title:
        description: "Release title"
        required: false
        type: string
      release_body:
        description: "Release body / notes"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: workflow-${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  runner-selection:
    uses: DatomerAB/par-releases/.github/workflows/select-runner.yml@d2839636e84e6a6816f2c7b6d8df885dbbaefbf2
    with:
      runner_preference: ${{ inputs.runner_preference || vars.RUNNER_PREFERENCE || 'self-hosted-preferred' }}
      self_hosted_labels: '["self-hosted"]'
      controller_labels: '["self-hosted"]'
      github_hosted_label: ubuntu-latest
      wait_minutes: ${{ fromJSON(github.event.inputs.wait_minutes || vars.RUNNER_WAIT_MINUTES || '30') }}
    secrets:
      runner_check_token: ${{ secrets.SELF_HOSTED_RUNNER_CHECK_TOKEN }}
    permissions:
      actions: read

  draft:
    needs: runner-selection
    runs-on: ${{ fromJSON(needs.runner-selection.outputs.runs_on) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PowerShell is available on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v pwsh >/dev/null 2>&1; then
            brew install --cask powershell
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Isolate Python 3.12 dependencies
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'changelog-python'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Could not create Python 3.12 virtual environment' }
          $venvScripts = if ($IsWindows) { Join-Path $venv 'Scripts' } else { Join-Path $venv 'bin' }
          $venvScripts | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8NoBOM

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Test changelog script
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --quiet pytest
          if ($LASTEXITCODE -ne 0) { throw 'Could not install pytest' }
          python -m pytest scripts/test_draft_changelog.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Changelog tests failed' }

      - name: Create changelog post and update fallback URL
        id: create
        shell: pwsh
        env:
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          DMG_URL: ${{ github.event.client_payload.dmg_url || inputs.dmg_url }}
          RELEASE_TITLE: ${{ github.event.client_payload.release_title || inputs.release_title || '' }}
          RELEASE_BODY: ${{ github.event.client_payload.release_body || inputs.release_body || '' }}
          SOURCE_REPO: ${{ github.event.client_payload.source_repo || 'DatomerAB/Par' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/draft_changelog.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not draft changelog' }

      - name: Sync model attribution from Pär
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $encodedModels = gh api repos/DatomerAB/Par/contents/config/website_models.json --jq '.content'
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch canonical models from Pär' }
          $canonicalModels = Join-Path $env:RUNNER_TEMP 'website_models.json'
          [IO.File]::WriteAllBytes($canonicalModels, [Convert]::FromBase64String($encodedModels))
          $currentModels = [IO.File]::ReadAllText('src/data/models.json').Replace("`r`n", "`n")
          $expectedModels = [IO.File]::ReadAllText($canonicalModels).Replace("`r`n", "`n")
          if ($currentModels -ceq $expectedModels) {
            Write-Host 'src/data/models.json is already up to date'
          } else {
            Copy-Item $canonicalModels 'src/data/models.json' -Force
            Write-Host 'Updated src/data/models.json from Pär'
          }

      - name: Run checks
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Website tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Website build failed' }

      - name: Create or update pull request
        id: pr
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          BRANCH: ${{ steps.create.outputs.branch }}
          HEADLINE: ${{ steps.create.outputs.headline }}
          PR_BODY_FILE: ${{ steps.create.outputs.pr_body_file }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure git author' }

          git checkout -b $env:BRANCH
          if ($LASTEXITCODE -ne 0) { throw 'Could not create changelog branch' }
          git add src/content/changelog/ src/App.jsx src/data/models.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage changelog files' }
          git commit -m "chore: draft changelog for $env:HEADLINE"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit changelog files' }
          # Force-push so re-dispatches overwrite the previous draft branch.
          git push --force origin $env:BRANCH
          if ($LASTEXITCODE -ne 0) { throw 'Could not push changelog branch' }

          $PSNativeCommandUseErrorActionPreference = $false
          $existingPr = gh pr list --head $env:BRANCH --base main --json url --jq '.[0].url' 2>$null
          $prListExitCode = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          if ($prListExitCode -ne 0) { $existingPr = '' }

          if (-not [string]::IsNullOrWhiteSpace($existingPr)) {
            gh pr edit $existingPr --title "chore: $env:HEADLINE" --body-file $env:PR_BODY_FILE
            if ($LASTEXITCODE -ne 0) { throw 'Could not update existing changelog PR' }
            $prUrl = $existingPr
            Write-Host "Updated existing draft PR: $prUrl"
          } else {
            $prUrl = gh pr create --title "chore: $env:HEADLINE" --body-file $env:PR_BODY_FILE --base main --head $env:BRANCH --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create changelog PR' }
            Write-Host "Created draft PR: $prUrl"
          }

          "pr_url=$prUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

      - name: Notify Slack
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
          OUTCOME: ${{ job.status }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          SOURCE_REPO: ${{ github.event.client_payload.source_repo || 'DatomerAB/Par' }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEBHOOK_URL)) {
            Write-Output '::warning::SLACK_RELEASE_WEBHOOK_URL is not set; skipping.'
            exit 0
          }

          if ($env:OUTCOME -eq 'success') {
            $color = '2f80ed'
            $title = 'Changelog draft ready for review'
            $link = $env:PR_URL
            $text = "A draft changelog PR for $env:TAG has been opened. Please review and edit before merging."
          } else {
            $color = 'ff4d4f'
            $title = 'Changelog draft failed'
            $link = $env:RUN_URL
            $text = "Failed to create the draft changelog PR for $env:TAG."
          }

          $payload = @{
            text = $title
            attachments = @(
              @{
                color = $color
                author_name = 'Pär Release Bot'
                author_icon = 'https://datomerab.github.io/par-public/assets/landing/icon.png'
                title = $title
                title_link = $link
                text = $text
                fields = @(
                  @{ title = 'Release'; value = $env:TAG; short = $true },
                  @{ title = 'Source'; value = $env:SOURCE_REPO; short = $true }
                )
                footer = 'Pär by Datomer'
                footer_icon = 'https://datomerab.github.io/par-public/assets/landing/datomer-logo.png'
              }
            )
          } | ConvertTo-Json -Depth 8 -Compress
          Invoke-RestMethod -Method Post -Uri $env:WEBHOOK_URL -ContentType 'application/json' -Body $payload | Out-Null

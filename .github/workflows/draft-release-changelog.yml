name: Draft release changelog post

# This workflow is triggered by a repository_dispatch event from the private
# DatomerAB/Par repo after a release has been published.  It opens a draft PR
# on DatomerAB/datomer.eu with:
#   - a new changelog post
#   - an updated fallback download URL in src/App.jsx
# for human review before merging.
#
# Required repo secret:
#   CROSS_REPO_DISPATCH_TOKEN - PAT that can push branches and create pull
#                               requests in this repo. The same token used by
#                               DatomerAB/Par to dispatch the event works here.

on:
  repository_dispatch:
    types: [release-published]

jobs:
  draft-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate changelog post and update fallback URL
        id: generate
        env:
          TAG: ${{ github.event.client_payload.tag }}
          DMG_URL: ${{ github.event.client_payload.dmg_url }}
          RELEASE_TITLE: ${{ github.event.client_payload.release_title }}
          RELEASE_BODY: ${{ github.event.client_payload.release_body }}
        run: |
          VERSION="${TAG#v}"
          SLUG_VERSION="${VERSION//./-}"
          DATE="$(date -u +%Y-%m-%d)"
          FILE="src/content/changelog/${DATE}-par-${SLUG_VERSION}.md"

          # Use the provided DMG URL, or build the canonical one from the tag.
          if [[ -n "${DMG_URL}" ]]; then
            FINAL_DMG_URL="${DMG_URL}"
          else
            FINAL_DMG_URL="https://github.com/DatomerAB/par-releases/releases/download/${TAG}/Par_${VERSION}_aarch64.dmg"
          fi

          mkdir -p "$(dirname "$FILE")"

          {
            echo "# Pär ${VERSION}"
            echo ""
            if [[ -n "${RELEASE_TITLE}" && "${RELEASE_TITLE}" != "Pär ${TAG}" ]]; then
              echo "${RELEASE_TITLE}."
              echo ""
            fi
            echo "## What's new"
            echo ""
            if [[ -n "${RELEASE_BODY}" && "${RELEASE_BODY}" != "Release ${TAG}" ]]; then
              echo "${RELEASE_BODY}"
            else
              echo "A new Pär release is available. Download the latest macOS build from the landing page."
            fi
            echo ""
            echo "## Download"
            echo ""
            echo "Get the latest DMG at [datomer.eu](https://datomer.eu/)."
          } > "$FILE"

          echo "Created ${FILE}:"
          cat "$FILE"

          # Update fallback URL in App.jsx so the site still works if latest.json fails.
          python3 - "$FINAL_DMG_URL" <<'PY'
          import re, sys
          url = sys.argv[1]
          path = 'src/App.jsx'
          content = open(path).read()
          content = re.sub(
              r"(const FALLBACK_DOWNLOAD_URL =\n\s+')([^']+)(')",
              rf"\g<1>{url}\g<3>",
              content,
          )
          open(path, 'w').write(content)
          PY

          echo "Updated src/App.jsx fallback URL to:"
          grep -A1 "const FALLBACK_DOWNLOAD_URL" src/App.jsx

          echo "file=${FILE}" >> "$GITHUB_OUTPUT"

      - name: Register changelog post in index
        env:
          TAG: ${{ github.event.client_payload.tag }}
          FILE: ${{ steps.generate.outputs.file }}
        run: |
          python3 - <<'PY'
          import os

          tag = os.environ["TAG"]
          file_path = os.environ["FILE"]
          filename = os.path.basename(file_path)
          basename = filename[:-3] if filename.endswith(".md") else filename
          import_name = "post_" + basename.replace("-", "_")
          version = tag.lstrip("v")
          slug = "par-" + version.replace(".", "-")
          date = basename[:10]
          title = f"Pär {version}"
          index_path = "src/content/changelog/index.js"

          with open(index_path, "r") as f:
              lines = f.readlines()

          # Insert import after the last ?raw import line.
          last_import_idx = max(
              i
              for i, line in enumerate(lines)
              if line.strip().startswith("import ") and "?raw" in line
          )
          lines.insert(last_import_idx + 1, f"import {import_name} from './{filename}?raw'\n")

          content = "".join(lines)

          # Insert post entry right after the posts array opening.
          post_entry = (
              f"  {{\n"
              f"    slug: '{slug}',\n"
              f"    date: '{date}',\n"
              f"    title: '{title}',\n"
              f"    raw: {import_name},\n"
              f"  }},\n"
          )
          content = content.replace("const posts = [", "const posts = [\n" + post_entry)

          with open(index_path, "w") as f:
              f.write(content)

          print(f"Updated {index_path} with import {import_name} and slug {slug}")
          PY

      - name: Create draft PR
        env:
          TAG: ${{ github.event.client_payload.tag }}
          SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
          # GITHUB_TOKEN cannot create PRs in this repo, so use the PAT that
          # dispatched the event. It already has write access here.
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        run: |
          BRANCH="release-notes/${TAG}"
          FILE="${{ steps.generate.outputs.file }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add "$FILE" src/App.jsx src/content/changelog/index.js
          git commit -m "chore: draft changelog, fallback URL, and index registration for ${TAG}"
          # Force-push so re-dispatches overwrite the previous draft branch.
          git push --force origin "$BRANCH"

          gh pr create \
            --title "Release notes: Pär ${TAG}" \
            --body "Draft changelog post, updated fallback download URL, and index registration for **${TAG}**.\n\nSource release: ${SOURCE_REPO}/releases/tag/${TAG}.\n\n### Review checklist\n- [ ] Changelog post is business-focused and accurate\n- [ ] Fallback download URL in \`src/App.jsx\` points to the correct DMG\n- [ ] New post is registered in \`src/content/changelog/index.js\`\n- [ ] No broken links or formatting issues\n\nMerge when ready to deploy." \
            --base main \
            --draft

          echo "Opened draft PR for ${TAG}"

name: Draft release changelog PR

on:
  repository_dispatch:
    types:
      - release-published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0-beta.2026083101)"
        required: true
        type: string
      dmg_url:
        description: "Direct download URL for the macOS DMG"
        required: true
        type: string
      release_title:
        description: "Release title"
        required: false
        type: string
      release_body:
        description: "Release body / notes"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Create changelog post and update fallback URL
        id: create
        env:
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          DMG_URL: ${{ github.event.client_payload.dmg_url || inputs.dmg_url }}
          RELEASE_TITLE: ${{ github.event.client_payload.release_title || inputs.release_title || '' }}
          RELEASE_BODY: ${{ github.event.client_payload.release_body || inputs.release_body || '' }}
          SOURCE_REPO: ${{ github.event.client_payload.source_repo || 'DatomerAB/Par' }}
        run: |
          set -euo pipefail
          python3 scripts/draft_changelog.py

      - name: Sync model attribution from Pär
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/DatomerAB/Par/contents/config/website_models.json \
            --jq '.content' \
            | base64 -d > /tmp/website_models.json

          if diff -q /tmp/website_models.json src/data/models.json >/dev/null 2>&1; then
            echo "✅ src/data/models.json is already up to date"
          else
            cp /tmp/website_models.json src/data/models.json
            echo "✅ Updated src/data/models.json from Pär"
          fi

      - name: Run checks
        run: |
          npm ci
          npm test
          npm run build

      - name: Create pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          BRANCH: ${{ steps.create.outputs.branch }}
          HEADLINE: ${{ steps.create.outputs.headline }}
          PR_BODY_FILE: ${{ steps.create.outputs.pr_body_file }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add src/content/changelog/ src/App.jsx src/data/models.json
          git commit -m "chore: draft changelog for ${HEADLINE}"
          # Force-push so re-dispatches overwrite the previous draft branch.
          git push --force origin "$BRANCH"

          pr_url=$(gh pr create \
            --title "chore: ${HEADLINE}" \
            --body-file "${PR_BODY_FILE}" \
            --base main \
            --head "$BRANCH" \
            --draft)

          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
          echo "✅ Created draft PR: ${pr_url}"

      - name: Notify Slack — changelog ready for review
        if: ${{ success() }}
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Changelog draft ready for review",
              "attachments": [
                {
                  "color": "2f80ed",
                  "author_name": "Pär Release Bot",
                  "author_icon": "https://datomerab.github.io/par-public/assets/landing/icon.png",
                  "title": "Changelog draft ready for review",
                  "title_link": "${{ steps.pr.outputs.pr_url }}",
                  "text": "A draft changelog PR for ${{ github.event.client_payload.tag || inputs.tag }} has been opened. Please review and edit before merging.",
                  "fields": [
                    {
                      "title": "Release",
                      "value": "${{ github.event.client_payload.tag || inputs.tag }}",
                      "short": true
                    },
                    {
                      "title": "Source",
                      "value": "${{ github.event.client_payload.source_repo || 'DatomerAB/Par' }}",
                      "short": true
                    }
                  ],
                  "footer": "Pär by Datomer",
                  "footer_icon": "https://datomerab.github.io/par-public/assets/landing/datomer-logo.png"
                }
              ]
            }

      - name: Notify Slack — changelog draft failed
        if: ${{ failure() }}
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Changelog draft failed",
              "attachments": [
                {
                  "color": "ff4d4f",
                  "author_name": "Pär Release Bot",
                  "author_icon": "https://datomerab.github.io/par-public/assets/landing/icon.png",
                  "title": "Changelog draft failed",
                  "title_link": "https://github.com/DatomerAB/datomer.eu/actions/workflows/draft-release-changelog.yml",
                  "text": "Failed to create the draft changelog PR for ${{ github.event.client_payload.tag || inputs.tag }}.",
                  "footer": "Pär by Datomer",
                  "footer_icon": "https://datomerab.github.io/par-public/assets/landing/datomer-logo.png"
                }
              ]
            }

name: Deploy daily-summary Worker

on:
  push:
    branches:
      - staging
      - main
    paths:
      - 'workers/daily-summary/**'
      - 'functions/api/_dailySummary.js'
      - 'functions/api/_db.js'
      - 'functions/api/_email.js'
      - '.github/workflows/deploy-daily-summary.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/daily-summary
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/daily-summary/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install test runner
        run: npm install --save-dev vitest

      - name: Run tests
        run: npm test

      - name: Deploy to preview
        if: github.ref == 'refs/heads/staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.PREVIEW_RESEND_API_KEY }}
          DAILY_SUMMARY_TO_EMAIL: ${{ secrets.PREVIEW_DAILY_SUMMARY_TO_EMAIL }}
        run: |
          echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --env preview
          if [ -n "$DAILY_SUMMARY_TO_EMAIL" ]; then
            echo "$DAILY_SUMMARY_TO_EMAIL" | npx wrangler secret put DAILY_SUMMARY_TO_EMAIL --env preview
          fi
          npx wrangler deploy --env preview

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.PRODUCTION_RESEND_API_KEY }}
          DAILY_SUMMARY_TO_EMAIL: ${{ secrets.PRODUCTION_DAILY_SUMMARY_TO_EMAIL }}
        run: |
          echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --env production
          if [ -n "$DAILY_SUMMARY_TO_EMAIL" ]; then
            echo "$DAILY_SUMMARY_TO_EMAIL" | npx wrangler secret put DAILY_SUMMARY_TO_EMAIL --env production
          fi
          npx wrangler deploy --env production

name: Deploy daily-summary Worker

on:
  push:
    branches:
      - staging
      - main
    paths:
      - 'workers/daily-summary/**'
      - 'functions/api/_dailySummary.js'
      - 'functions/api/_db.js'
      - 'functions/api/_email.js'
      - '.github/workflows/deploy-daily-summary.yml'
  workflow_dispatch:
    inputs:
      runner_preference:
        description: "Runner preference"
        type: choice
        default: self-hosted-preferred
        options: [self-hosted-preferred, github-hosted]
      wait_minutes:
        description: "Maximum availability wait (0-30 minutes)"
        type: number
        default: 30

concurrency:
  group: workflow-${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  runner-selection:
    uses: DatomerAB/par-releases/.github/workflows/select-runner.yml@d2839636e84e6a6816f2c7b6d8df885dbbaefbf2
    with:
      runner_preference: ${{ inputs.runner_preference || vars.RUNNER_PREFERENCE || 'self-hosted-preferred' }}
      self_hosted_labels: '["self-hosted"]'
      controller_labels: '["self-hosted"]'
      github_hosted_label: ubuntu-latest
      wait_minutes: ${{ fromJSON(github.event.inputs.wait_minutes || vars.RUNNER_WAIT_MINUTES || '30') }}
    secrets:
      runner_check_token: ${{ secrets.SELF_HOSTED_RUNNER_CHECK_TOKEN }}
    permissions:
      actions: read

  deploy:
    needs: runner-selection
    runs-on: ${{ fromJSON(needs.runner-selection.outputs.runs_on) }}
    defaults:
      run:
        working-directory: workers/daily-summary
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure PowerShell is available on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v pwsh >/dev/null 2>&1; then
            brew install --cask powershell
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/daily-summary/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install test runner
        run: npm install --save-dev vitest

      - name: Run tests
        run: npm test

      - name: Deploy to preview
        if: github.ref == 'refs/heads/staging'
        shell: pwsh
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.PREVIEW_RESEND_API_KEY }}
          DAILY_SUMMARY_SECRET: ${{ secrets.PREVIEW_DAILY_SUMMARY_SECRET }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:RESEND_API_KEY | npx wrangler secret put RESEND_API_KEY --env preview
          if ($LASTEXITCODE -ne 0) { throw "Could not update preview Resend secret" }
          if (-not [string]::IsNullOrWhiteSpace($env:DAILY_SUMMARY_SECRET)) {
            $env:DAILY_SUMMARY_SECRET | npx wrangler secret put DAILY_SUMMARY_SECRET --env preview
            if ($LASTEXITCODE -ne 0) { throw "Could not update preview summary secret" }
          }
          npx wrangler deploy --env preview
          if ($LASTEXITCODE -ne 0) { throw "Preview Worker deployment failed" }

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.PRODUCTION_RESEND_API_KEY }}
          DAILY_SUMMARY_SECRET: ${{ secrets.PRODUCTION_DAILY_SUMMARY_SECRET }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:RESEND_API_KEY | npx wrangler secret put RESEND_API_KEY --env production
          if ($LASTEXITCODE -ne 0) { throw "Could not update production Resend secret" }
          if (-not [string]::IsNullOrWhiteSpace($env:DAILY_SUMMARY_SECRET)) {
            $env:DAILY_SUMMARY_SECRET | npx wrangler secret put DAILY_SUMMARY_SECRET --env production
            if ($LASTEXITCODE -ne 0) { throw "Could not update production summary secret" }
          }
          npx wrangler deploy --env production
          if ($LASTEXITCODE -ne 0) { throw "Production Worker deployment failed" }

name: Check Pär content sync

# Validates that datomer.eu's product metadata remains identical to the
# canonical payload generated in the private DatomerAB/Par repository.
# This is a safety net in case a manual edit bypasses the automated sync.

on:
  pull_request:
    paths:
      - "src/data/models.json"
      - "src/data/ai_disclaimers.json"
      - "src/data/eu_ai_act_exclude_list.yaml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check-models:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout datomer.eu
        uses: actions/checkout@v4

      - name: Fetch canonical models from Pär
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/par-canonical
          gh api repos/DatomerAB/Par/contents/config/website_models.json \
            --jq '.content' \
            | base64 -d > /tmp/par-canonical/website_models.json

      - name: Compare models.json
        run: |
          set -euo pipefail
          diff -u /tmp/par-canonical/website_models.json src/data/models.json
          echo "✅ datomer.eu/src/data/models.json matches Pär/config/website_models.json"

      - name: Fetch canonical AI disclaimers from Pär
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/par-canonical
          gh api repos/DatomerAB/Par/contents/config/eu_ai_act_exclude_list.yaml \
            --jq '.content' \
            | base64 -d > /tmp/par-canonical/eu_ai_act_exclude_list.yaml

      - name: Generate canonical ai_disclaimers.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, yaml, pathlib
          src = pathlib.Path('/tmp/par-canonical/eu_ai_act_exclude_list.yaml')
          out = pathlib.Path('/tmp/par-canonical/ai_disclaimers.json')
          data = yaml.safe_load(src.read_text())
          en = data.get('required_disclaimers', {})
          localized = {
              'en': en,
              'sv': {
                  'ai_identity': 'Pär är en AI-assistent. Svaren kan vara felaktiga eller föråldrade.',
                  'not_professional': 'Pär är inte en medicinsk, juridisk eller psykisk-hälsoprofessionell.',
                  'crisis': 'Om du befinner dig i kris eller behöver medicinsk eller psykisk-hälsostöd, kontakta en kvalificerad professionell eller en nödtjänst.',
                  'annex_iii_notice': 'Pär får inte användas för högriskändamål som biometri, kritisk infrastruktur, rekrytering, kreditbedömning, utbildningsbedömning, polisiärt arbete, migrationskontroll, rättsligt beslutsfattande eller demokratiska processer.',
              },
              'de': {
                  'ai_identity': 'Pär ist ein KI-Assistent. Antworten können ungenau oder veraltet sein.',
                  'not_professional': 'Pär ist kein medizinischer, juristischer oder psychischer Gesundheitsfachmann.',
                  'crisis': 'Wenn Sie sich in einer Krise befinden oder medizinische oder psychische Unterstützung benötigen, wenden Sie sich an einen qualifizierten Fachmann oder einen Notdienst.',
                  'annex_iii_notice': 'Pär darf nicht für Hochrisikozwecke wie Biometrie, kritische Infrastruktur, Personalrekrutierung, Kreditscoring, Bildungsbewertung, Polizeiarbeit, Migrationskontrolle, richterliche Entscheidungsfindung oder demokratische Prozesse verwendet werden.',
              },
          }
          out.write_text(json.dumps(localized, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Compare ai_disclaimers.json
        run: |
          set -euo pipefail
          diff -u /tmp/par-canonical/ai_disclaimers.json src/data/ai_disclaimers.json
          echo "✅ datomer.eu/src/data/ai_disclaimers.json matches Pär/config/eu_ai_act_exclude_list.yaml"

name: Check Pär content sync

# Validates that datomer.eu's product metadata remains identical to the
# canonical payload generated in the private DatomerAB/Par repository.
# This is a safety net in case a manual edit bypasses the automated sync.

on:
  pull_request:
    paths:
      - "src/data/models.json"
      - "src/data/ai_disclaimers.json"
      - "src/data/eu_ai_act_exclude_list.yaml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      runner_preference:
        description: "Runner preference"
        type: choice
        default: self-hosted-preferred
        options: [self-hosted-preferred, github-hosted]
      wait_minutes:
        description: "Maximum availability wait (0-30 minutes)"
        type: number
        default: 30

concurrency:
  group: workflow-${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  runner-selection:
    uses: DatomerAB/par-releases/.github/workflows/select-runner.yml@599e624510ffd5dbb61e24ab9664d0b9b4f01708
    with:
      runner_preference: ${{ inputs.runner_preference || vars.RUNNER_PREFERENCE || 'self-hosted-preferred' }}
      self_hosted_labels: '["self-hosted","macOS","ARM64","par"]'
      github_hosted_label: ubuntu-latest
      wait_minutes: ${{ fromJSON(github.event.inputs.wait_minutes || vars.RUNNER_WAIT_MINUTES || '30') }}
    secrets:
      runner_check_token: ${{ secrets.SELF_HOSTED_RUNNER_CHECK_TOKEN }}
    permissions:
      actions: read

  check-models:
    needs: runner-selection
    runs-on: ${{ fromJSON(needs.runner-selection.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - name: Checkout datomer.eu
        uses: actions/checkout@v4

      - name: Fetch canonical models from Pär
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/par-canonical"
          gh api repos/DatomerAB/Par/contents/config/website_models.json \
            --jq '.content' \
            | base64 -d > "$RUNNER_TEMP/par-canonical"/website_models.json

      - name: Compare models.json
        run: |
          set -euo pipefail
          diff -u "$RUNNER_TEMP/par-canonical"/website_models.json src/data/models.json
          echo "✅ datomer.eu/src/data/models.json matches Pär/config/website_models.json"

      - name: Fetch canonical AI disclaimers from Pär
        env:
          # DatomerAB/Par is private, so the repo-scoped GITHUB_TOKEN cannot read it.
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/par-canonical"
          gh api repos/DatomerAB/Par/contents/config/eu_ai_act_exclude_list.yaml \
            --jq '.content' \
            | base64 -d > "$RUNNER_TEMP/par-canonical"/eu_ai_act_exclude_list.yaml

          # Fetch the generator too, rather than reimplementing it here. The
          # Swedish and German literals used to be duplicated in this file, so
          # editing one repo and not the other produced a diff that looked like
          # drift from Pär when it was really drift between two copies.
          gh api repos/DatomerAB/Par/contents/scripts/build_ai_disclaimers.py \
            --jq '.content' \
            | base64 -d > "$RUNNER_TEMP/par-canonical"/build_ai_disclaimers.py

      - name: Generate canonical ai_disclaimers.json
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/sync-python"
          "$RUNNER_TEMP/sync-python/bin/python" -m pip install --quiet pyyaml
          "$RUNNER_TEMP/sync-python/bin/python" "$RUNNER_TEMP/par-canonical"/build_ai_disclaimers.py \
            --config "$RUNNER_TEMP/par-canonical"/eu_ai_act_exclude_list.yaml \
            --output "$RUNNER_TEMP/par-canonical"/ai_disclaimers.json

      - name: Compare ai_disclaimers.json
        run: |
          set -euo pipefail
          diff -u "$RUNNER_TEMP/par-canonical"/ai_disclaimers.json src/data/ai_disclaimers.json
          echo "✅ datomer.eu/src/data/ai_disclaimers.json matches Pär/config/eu_ai_act_exclude_list.yaml"

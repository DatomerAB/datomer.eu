name: Notify Slack on PR

# Announces new pull requests to #pär-releases so cross-repo remediation PRs
# are not missed. Fork PRs do not receive secrets, so the step skips cleanly.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      runner_preference:
        description: "Runner preference"
        type: choice
        default: self-hosted-preferred
        options: [self-hosted-preferred, github-hosted]
      wait_minutes:
        description: "Maximum availability wait (0-30 minutes)"
        type: number
        default: 30

permissions:
  contents: read

jobs:
  runner-selection:
    uses: DatomerAB/par-releases/.github/workflows/select-runner.yml@d2839636e84e6a6816f2c7b6d8df885dbbaefbf2
    with:
      runner_preference: ${{ inputs.runner_preference || vars.RUNNER_PREFERENCE || 'self-hosted-preferred' }}
      self_hosted_labels: '["self-hosted","Windows","X64","jcwindows"]'
      controller_labels: '["self-hosted","Windows","X64","jcwindows"]'
      github_hosted_label: ubuntu-latest
      wait_minutes: ${{ fromJSON(github.event.inputs.wait_minutes || vars.RUNNER_WAIT_MINUTES || '30') }}
    secrets:
      runner_check_token: ${{ secrets.SELF_HOSTED_RUNNER_CHECK_TOKEN }}
    permissions:
      actions: read

  notify:
    needs: runner-selection
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(needs.runner-selection.outputs.runs_on) }}
    timeout-minutes: 10
    steps:
      - name: Post to Slack
        shell: pwsh
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEBHOOK_URL)) {
            Write-Warning "SLACK_RELEASE_WEBHOOK_URL is not available (fork PR?); skipping."
            exit 0
          }

          $payload = @{
            text = "Pull request opened in $env:REPO"
            attachments = @(
              @{
                color = '2f80ed'
                title = "#$($env:PR_NUMBER) $($env:PR_TITLE)"
                title_link = $env:PR_URL
                fields = @(
                  @{ title = 'Repository'; value = $env:REPO; short = $true },
                  @{ title = 'Author'; value = $env:PR_AUTHOR; short = $true }
                )
                footer = 'Pär by Datomer'
              }
            )
          } | ConvertTo-Json -Depth 6 -Compress

          Invoke-RestMethod -Method Post -Uri $env:WEBHOOK_URL -ContentType 'application/json' -Body $payload | Out-Null
